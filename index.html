<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List</h1>

        <div class="input-section">
            <label for="taskInput" class="sr-only">Nový úkol</label>
            <input type="text" id="taskInput" placeholder="Zadej nový úkol..." autofocus>
            <button id="addBtn">Přidat</button>
        </div>

        <div class="task-options">
            <div class="option-group">
                <label for="prioritySelect">Priorita:</label>
                <select id="prioritySelect">
                    <option value="low">Nízká</option>
                    <option value="medium" selected>Střední</option>
                    <option value="high">Vysoká</option>
                </select>
            </div>
            <div class="option-group">
                <label for="categorySelect">Kategorie:</label>
                <select id="categorySelect">
                    <option value="personal">Osobní</option>
                    <option value="work">Práce</option>
                    <option value="shopping">Nákupy</option>
                    <option value="health">Zdraví</option>
                </select>
            </div>
            <div class="option-group">
                <label for="deadlineInput">Deadline:</label>
                <input type="date" id="deadlineInput">
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Vše</button>
            <button class="filter-btn" data-filter="active">Aktivní</button>
            <button class="filter-btn" data-filter="completed">Hotové</button>
        </div>

        <div class="category-filters">
            <button class="category-btn active" data-category="all">Všechny</button>
            <button class="category-btn" data-category="personal">Osobní</button>
            <button class="category-btn" data-category="work">Práce</button>
            <button class="category-btn" data-category="shopping">Nákupy</button>
            <button class="category-btn" data-category="health">Zdraví</button>
        </div>

        <ul id="taskList"></ul>

        <div class="stats">
            <span id="taskCount">0 úkolů</span>
            <button id="clearCompleted">Vymazat hotové</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
